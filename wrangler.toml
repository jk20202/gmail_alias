# ==================================================================
# mail-alias v2 —— 邮件转发聚合版
# 与 v1(mail-alias)完全独立的部署,互不影响。
#
# 收信原理: 各邮箱在自己的设置里开启「自动转发」→ 转发到本 Worker 绑定的域名
#           → Cloudflare Email Routing → Email Worker(src/email.ts) → D1 + R2
# 因此不需要 OAuth 授权,也不需要 IMAP 应用密码。
# ==================================================================
name = "mail-alias-v2"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers 静态资源(前端界面)
# run_worker_first = true: 所有请求先经过 Worker,由 Worker 调用 ASSETS 并设置缓存头
# 这样能确保 HTML 不被 CDN 边缘缓存,用户总能加载最新前端代码
[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = true

# ------------------------------------------------------------------
# 以下三个资源的 ID 需要先创建后填入:
#   npx wrangler d1 create mail_alias_v2
#   npx wrangler kv namespace create MAIL_ALIAS_V2_KV
#   npx wrangler r2 bucket create mail-alias-v2-raw
# 或直接执行: bash scripts/provision.sh   (自动创建并回填本文件)
# ------------------------------------------------------------------

# D1 数据库(用户/邮箱账号/邮件元数据/Webhook/日志)
[[d1_databases]]
binding = "DB"
database_name = "mail_alias_v2"
database_id = "db27fd65-d40f-45fb-8118-a27049ba2606"

# KV(会话缓存 / Webhook 推送去重)
[[kv_namespaces]]
binding = "KV"
id = "abf683838fbf4af3ae8d033c10052d44"

# R2:存放接收到的原始邮件(.eml)
# 正文与附件不入库,由前端下载 raw 后用 postal-mime 在浏览器解析,
# 从而把 MIME 解析的 CPU 开销完全移出 Worker(免费套餐仅 10ms CPU)。
[[r2_buckets]]
binding = "EMAIL_RAW"
bucket_name = "mail-alias-v2-raw"

# ------------------------------------------------------------------
# 变量
# ------------------------------------------------------------------
[vars]
# 收信域名(必填): 已接入 Cloudflare 并开启 Email Routing 的域名。
RECV_DOMAIN = "jkf.kdns.fr"

# 统一转发地址(强烈建议配置):
# 全站**唯一**的收信地址。所有外部邮箱都只在自己的设置里把收到的邮件
# 转发到这一个地址;系统根据邮件的收件头自动归属到对应邮箱/别名。
# 配置后不再为单个邮箱生成任何 f-xxxx 形式的专属地址。
UNIFIED_FORWARD_ADDRESS = "alle@jkf.kdns.fr"

# 兜底账号 ID(可选,但强烈建议配置):
# 当 Email Worker 收到一封邮件、又无法归属到任何别名/主邮箱时,
# 直接把它交给这个 account_id,而不是拒收。
# ⚠ 注意:这里必须填一个**仍然存在**的邮箱 ID,删除该邮箱后要同步改这里,
#    否则兜底失效(可在「我的账户」查到邮箱 ID,或到 email_unmatched 诊断里确认)。
CATCHALL_ACCOUNT_ID = "va6ae88e5"

# 默认管理员(首次部署时初始化用,部署后请立即在「我的账户」修改密码)
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "请修改为你的强密码"

# 安全密钥: 请用 wrangler secret 写入,不要明文提交
# JWT_SECRET = "随机长字符串"
# ENCRYPT_KEY = "32字节hex"

# Cron Trigger: 每分钟检查新邮件并推送到已订阅的 Webhook
# (v2 邮件已由 Email Worker 实时入库,这里只负责把「新收到的」推给 Webhook,
#  并用 KV 做 1 小时去重,不会重复推送)
[triggers]
crons = ["* * * * *"]

# 注意: 不要加 [limits] cpu_ms —— 当前免费套餐会在 deploy 阶段拒收 limits 配置导致部署失败。
# v2 的三条路径(收信 / 列表 / 详情)都已刻意设计在 10ms CPU 以内,无需调高限额。
#
# Email Routing 本身不在 wrangler 里配置,需在 Cloudflare 后台完成:
#   Email → Email Routing → Routing rules → 添加规则 → 动作选择「Send to Worker」→ mail-alias-v2
# 详见 README.md
