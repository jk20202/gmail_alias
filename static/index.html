<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="别名邮箱管理系统 - 多别名邮箱、邮件聚合查询、Webhook 卡片推送">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>别名邮箱管理系统</title>
<link rel="stylesheet" href="css/style.css?v=20260901d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>A</text></svg>">
</head>
<body>

<!-- ============ 登录页 ============ -->
<!-- 默认隐藏:避免刷新时先闪现登录页(静默刷新,校验通过后才显示对应视图) -->
<div id="loginView" class="login-wrap hidden">
  <div class="login-card">
    <div class="brand">
      <div class="logo">A</div>
      <h1>别名邮箱管理系统</h1>
      <p>多别名邮箱 · 邮件聚合查询 · Webhook 卡片推送</p>
    </div>
    <div id="loginError" class="login-error"></div>
    <div class="login-tabs">
      <button id="tabLogin" class="active" onclick="switchLoginTab('login')">登录</button>
      <button id="tabRegister" onclick="switchLoginTab('register')">注册</button>
    </div>
    <form id="loginForm" onsubmit="doLogin(event); return false;">
      <div class="form-group">
        <label class="form-label" for="loginUsername">用户名</label>
        <input type="text" id="loginUsername" class="form-control" placeholder="请输入用户名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">密码</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-block">登录</button>
    </form>
    <form id="registerForm" class="hidden" onsubmit="doRegister(event); return false;">
      <div class="form-group">
        <label class="form-label" for="regUsername">用户名 <span class="req">*</span></label>
        <input type="text" id="regUsername" class="form-control" placeholder="至少 3 个字符" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="regPassword">密码 <span class="req">*</span></label>
        <input type="password" id="regPassword" class="form-control" placeholder="至少 6 个字符" required>
      </div>
      <button type="submit" class="btn btn-block">注册</button>
    </form>
  </div>
</div>

<!-- ============ 主应用: 左侧导航 + 右侧内容 ============ -->
<div id="appView" class="app hidden">
  <div class="sidebar-mask" id="sidebarMask" onclick="toggleSidebar(false)"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="mark">A</span>
      <span>
        <div class="name">别名邮箱</div>
        <div class="slogan">Mail Alias System</div>
      </span>
    </div>
    <nav class="sidebar-nav" id="appNav" aria-label="主导航"></nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <span class="avatar" id="navAvatar">U</span>
        <span class="u-meta">
          <div class="u-name" id="navUsername"></div>
          <div class="u-role" id="navRole"></div>
        </span>
        <button class="icon-btn" title="登出" onclick="doLogout()" aria-label="登出">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="app-body">
    <header class="topbar">
      <button class="icon-btn sidebar-toggle" onclick="toggleSidebar(true)" aria-label="展开菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div>
        <div class="t-title" id="topbarTitle">邮件查询</div>
        <div class="t-desc" id="topbarDesc">聚合查询所有生效别名邮箱的收件</div>
      </div>
      <div class="t-actions" id="topbarActions"></div>
    </header>
    <main class="app-main" id="appMain"></main>
  </div>
</div>

<!-- ============ 启动过渡层(默认可见,校验完成后由 JS 隐藏) ============ -->
<div id="bootSplash" class="boot-splash">
  <span class="spinner"></span>
  <span>正在加载…</span>
</div>

<div id="toastBox"></div>
<div id="modalRoot"></div>

<!-- JS: 核心 + 各页面模块 -->
<script src="js/app.js?v=20260901d"></script>
<script src="js/mail.js?v=20260901d"></script>
<script src="js/account.js?v=20260901d"></script>
<script src="js/webhook.js?v=20260901d"></script>
<script src="js/docs.js?v=20260901d"></script>
<script src="js/users.js?v=20260901d"></script>
<script src="js/settings.js?v=20260901d"></script>
</body>
</html>
