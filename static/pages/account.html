<div class="page-title">我的账户</div>
<div class="page-desc">管理个人信息、API Key、邮箱绑定与登录密码</div>

<div class="card-stack">
  <div class="card account-card">
    <div class="card-header"><h3>基本信息</h3></div>
    <div class="card-body" id="accountInfoBody">
      <div class="account-info-grid">
        <div class="info-item" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap">
          <span class="label">用户名</span>
          <span class="value" id="accUsername"></span>
          <button class="btn btn-secondary btn-sm" onclick="openChangePasswordModal()">修改密码</button>
        </div>
        <div class="info-item">
          <span class="label">角色</span>
          <span class="value" id="accRole"></span>
        </div>
        <div class="info-item">
          <span class="label">创建时间</span>
          <span class="value" id="accCreatedAt"></span>
        </div>
      </div>
      <div class="apikey-box">
        <div class="apikey-label">
          <span class="label">API Key</span>
          <span class="form-hint">编程调用接口的密钥，重新生成后旧密钥立即失效</span>
        </div>
        <div class="apikey-row">
          <span class="mono" id="apiKeyText"></span>
          <button class="btn btn-secondary btn-sm" id="btnCopyApiKey">复制</button>
          <button class="btn btn-danger btn-sm" onclick="regenApiKey()">重新生成</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card account-card">
    <div class="card-header"><h3>邮箱绑定</h3></div>
    <div class="card-body">
      <p class="form-hint" style="margin-bottom:12px">
        只需填写<b>主邮箱地址</b>即可添加，<b>无需 OAuth 授权、无需应用密码</b>。
        添加后系统会为该邮箱生成一个<b>专属转发地址</b>，你去原邮箱（Gmail / Outlook / QQ / 163 等）
        的设置里把收到的邮件<b>自动转发</b>到该地址，即可在这里统一收信。
        添加时可设置是否<b>支持别名</b>（默认关闭，关闭时该邮箱只能直接选中收信）以及是否<b>公开共享</b>。
      </p>
      <div class="bind-actions" style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap">
        <button class="btn btn-primary" onclick="openBindModal()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          添加邮箱
        </button>
      </div>
      <h4 style="font-size:13px; color:var(--text-light); margin-bottom:8px">已绑定的邮箱</h4>
      <div id="myAccounts"><div class="loading"><span class="spinner"></span> 加载中...</div></div>
    </div>
  </div>
</div>
