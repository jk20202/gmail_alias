<div class="page-title">我的账户</div>
<div class="page-desc">管理个人信息、API Key、邮箱绑定与登录密码</div>

<div class="card-stack">
  <!--
    基本信息板块 (2026-09 v3):
      - 2x2 紧凑网格,每格 label + value 上下排,避免水平挤压看不清
      - 角色用 badge 突出,不再用 12px 灰字 (字号统一为 body)
      - 修改密码放右上角操作区,与账号信息在视觉上分离
      - API Key 单独一块,内含说明 + 行内操作(复制/重新生成),不与基本信息混在一起
  -->
  <div class="card account-card">
    <div class="card-header">
      <h3>基本信息</h3>
      <button class="btn btn-secondary btn-sm" onclick="openChangePasswordModal()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        修改密码
      </button>
    </div>
    <div class="card-body" id="accountInfoBody">
      <div class="basic-info-grid">
        <div class="big-cell">
          <div class="cell-label">用户名</div>
          <div class="cell-value" id="accUsername">—</div>
        </div>
        <div class="big-cell">
          <div class="cell-label">角色</div>
          <div class="cell-value" id="accRole">—</div>
        </div>
        <div class="big-cell">
          <div class="cell-label">创建时间</div>
          <div class="cell-value mono" id="accCreatedAt">—</div>
        </div>
        <div class="big-cell">
          <div class="cell-label">API 操作</div>
          <div class="cell-value cell-actions">
            <button class="btn btn-secondary btn-sm" onclick="openChangePasswordModal()">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              修改密码
            </button>
          </div>
        </div>
      </div>

      <div class="apikey-block">
        <div class="apikey-head">
          <div class="cell-label">API Key</div>
          <div class="apikey-hint">编程调用接口的密钥, 重新生成后旧密钥立即失效</div>
        </div>
        <div class="apikey-row">
          <span class="mono apikey-text" id="apiKeyText">加载中...</span>
          <div class="apikey-actions">
            <button class="btn btn-secondary btn-sm" id="btnCopyApiKey">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              复制
            </button>
            <button class="btn btn-danger btn-sm" onclick="regenApiKey()">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              重新生成
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card account-card">
    <div class="card-header"><h3>邮箱绑定</h3></div>
    <div class="card-body">
      <p class="form-hint" style="margin-bottom:12px">
        只需填写<b>主邮箱地址</b>即可添加，<b>无需 OAuth 授权、无需应用密码</b>。
        所有邮箱统一把收到的邮件<b>自动转发到 <span class="mono" id="unifiedForwardAddr">加载中...</span></b>，即可在这里统一收信。
        系统会根据收件地址自动归属到对应邮箱或别名。
        添加时可设置是否<b>支持别名</b>（默认关闭，关闭时该邮箱只能直接选中收信）以及是否<b>公开共享</b>。
      </p>
      <div class="bind-actions" style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap">
        <button class="btn btn-primary" onclick="openBindModal()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          添加邮箱
        </button>
        <button class="btn btn-outline" onclick="openForwardDiagnose()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          收信诊断
        </button>
      </div>
      <h4 style="font-size:13px; color:var(--text-light); margin-bottom:8px">已绑定的邮箱</h4>
      <div id="myAccounts"><div class="loading"><span class="spinner"></span> 加载中...</div></div>
    </div>
  </div>
</div>
