name: Deploy v2 to Cloudflare

# v2(邮件转发聚合版)独立部署:cloudflarev2 分支 push 即触发
# 与 v1 的 deploy.yml(cloudflare 分支)互不影响,两套 Worker 并存
on:
  push:
    branches: [cloudflarev2]
    paths:
      - 'src/**'
      - 'static/**'
      - 'schema.sql'
      - 'wrangler.toml'
      - 'scripts/**'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch:  # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Worker v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Install Dependencies
        run: npm install

      - name: Type Check
        run: npx tsc --noEmit

      - name: Check resource IDs are filled
        run: |
          if grep -q "REPLACE_WITH" wrangler.toml; then
            echo "::error::wrangler.toml 里还有未替换的资源 ID 占位符。"
            echo "请先执行 bash scripts/provision.sh 开通 D1/KV/R2 并回填 ID 后再部署。"
            exit 1
          fi

      - name: Apply D1 schema (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute mail_alias_v2 --remote --file=./schema.sql

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Notify
        if: always()
        run: |
          echo "Deploy status: ${{ job.status }}"
          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "Worker v2 已部署。"
            echo "别忘了在 Cloudflare 后台完成 Email Routing 配置:"
            echo "  Email → Email Routing → Routing rules → Send to Worker → mail-alias-v2"
          fi
